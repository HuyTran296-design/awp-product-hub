<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWP Product Hub</title>
  <meta name="description" content="Quản trị hiệu quả và chi phí các dự án và sản phẩm của team AWP — ABC Digital">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply the saved theme before first paint (default: light).
    try {
      const t = localStorage.getItem('awp-theme') || 'light';
      if (t === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    } catch {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
